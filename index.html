<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAROCMARKET – Gestion des réclamations clients</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f8f9fb; --line:#e3e5ea;
  --ink:#121826; --ink-2:#4a5162; --ink-3:#7a8194;
  --brand:#1c5cab; --brand-2:#2a78d6; --brand-soft:#e6f0fc;
  --bar:#2a78d6; --bar-2:#86b6ef;
  --good:#0a7d0a; --good-bg:#e5f5e5;
  --warn:#8a5a00; --warn-bg:#fdf1d6;
  --serious:#a8471f; --serious-bg:#fbe7de;
  --crit:#b42828; --crit-bg:#fbe3e3;
  --info:#1c5cab; --info-bg:#e6f0fc;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.logo small{display:block;font-weight:500;color:var(--ink-3);font-size:11.5px;letter-spacing:0}
nav.tabs{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
nav.tabs a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-weight:500}
nav.tabs a:hover{background:var(--surface-2)}
nav.tabs a.on{background:var(--brand-soft);color:var(--brand)}
.mode{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.dot.on{background:var(--good)} .dot.local{background:#eda100}
main{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:21px;margin:0 0 4px} h2{font-size:15px;margin:0 0 12px}
.sub{color:var(--ink-2);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(165px,1fr));margin-bottom:14px}
.kpi .lbl{color:var(--ink-2);font-size:12.5px;font-weight:500}
.kpi .val{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .hint{color:var(--ink-3);font-size:12px;margin-top:2px}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.bars{display:flex;flex-direction:column;gap:7px}
.brow{display:grid;grid-template-columns:150px 1fr 54px;align-items:center;gap:10px;font-size:13px;padding:2px 0;border-radius:6px}
.brow:hover{background:var(--surface-2)}
.brow .bl{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .track{height:14px;position:relative}
.brow .fill{height:100%;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.brow .bv{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px;border-bottom:1px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;position:relative;cursor:default}
.col .f{background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.col:hover .f{background:var(--brand)}
.colx{display:flex;gap:6px;margin-top:5px}
.colx span{flex:1;text-align:center;font-size:11px;color:var(--ink-3)}
.tip{position:fixed;pointer-events:none;background:#121826;color:#fff;padding:6px 9px;border-radius:6px;font-size:12px;z-index:50;display:none;max-width:260px}
.legend{font-size:12px;color:var(--ink-3);margin-top:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#184f95}
.btn.ai{background:#f1effd;border-color:#d6d1f6;color:#4a3aa7}
.btn.ai:hover{background:#e7e3fb}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:200px}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-soft)}
textarea{width:100%;min-height:110px;resize:vertical}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12px;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--surface-2)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-Urgente{background:var(--crit-bg);color:var(--crit)}
.p-Élevée{background:var(--serious-bg);color:var(--serious)}
.p-Moyenne{background:var(--warn-bg);color:var(--warn)}
.p-Faible{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.late{color:var(--crit);font-weight:600}
.muted{color:var(--ink-3)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--ink-2);font-size:13px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field input,.field select{width:100%}
.full{grid-column:1/-1}
.req{color:var(--crit)}
.aibox{border:1px solid #d6d1f6;background:#f8f7fe;border-radius:var(--radius);padding:14px;margin-top:12px}
.aibox h3{margin:0 0 8px;font-size:13.5px;color:#4a3aa7;display:flex;align-items:center;gap:6px}
.aibox .warnline{font-size:12px;color:var(--ink-2);margin-top:8px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.steps{display:flex;gap:0;margin:6px 0 16px;flex-wrap:wrap}
.step{flex:1;min-width:110px;text-align:center;padding:9px 6px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-3);position:relative}
.step:first-child{border-radius:8px 0 0 8px}.step:last-child{border-radius:0 8px 8px 0}
.step.done{background:var(--good-bg);color:var(--good);border-color:#c5e6c5}
.step.cur{background:var(--brand);color:#fff;border-color:var(--brand)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{padding:8px 0 8px 18px;border-left:2px solid var(--line);position:relative;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-6px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--brand-2)}
.timeline .t{color:var(--ink-3);font-size:12px}
.detail{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}
@media (max-width:860px){.detail{grid-template-columns:1fr}.brow{grid-template-columns:110px 1fr 46px}}
.banner{border:1px solid #f3dca5;background:#fff8e6;color:#6b4a00;border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.ok{border-color:#c5e6c5;background:#f0faf0;color:#145c14}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#121826;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:13px;display:none}
.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.synth{white-space:pre-wrap;font-size:13.5px;line-height:1.55}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.foot{color:var(--ink-3);font-size:12px;margin-top:30px;text-align:center}
.hide{display:none!important}
.backlink{display:inline-block;margin-bottom:10px;text-decoration:none;font-weight:500}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo"><div class="logo-mark">MM</div><div>MAROCMARKET<small>Gestion des réclamations clients</small></div></div>

  <div class="mode" id="mode"><span class="dot"></span><span>Connexion…</span></div>
</div></header>
<main id="view"></main>

let dbMap = {}, localMap = {};
let db = null, dbState = "pending", dbWritable = null;

function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(localMap)); } catch(e){} }
function allRecords(){
  const m = Object.assign({}, BASE, dbMap, localMap);
  return Object.values(m).sort((a,b)=> (b.dateReception||"").localeCompare(a.dateReception||"") || b.id.localeCompare(a.id));
}
function getRec(id){ return localMap[id] || dbMap[id] || BASE[id] || null; }
async function saveRec(rec){
  rec = JSON.parse(JSON.stringify(rec));
  if (db && dbWritable !== false){
    try {
      await db.collection("reclamations").doc(rec.id).set(rec);
      dbMap[rec.id] = rec; if (localMap[rec.id]) { delete localMap[rec.id]; saveLocal(); }
      return "db";
    } catch(e){
      if (e && (e.code === "invalid_argument" || e.code === "not_granted" || e.code === "revoked" || e.code==="capability_disabled")) { dbWritable = false; renderMode(); }
      else if (e && e.code === "quota_exceeded") { toast("Base en ligne pleine : enregistrement local."); }
    }
  }
  localMap[rec.id] = rec; saveLocal(); return "local";
}
function renderMode(){
  const el = document.getElementById("mode");
  let cls="", txt="";
  if (db && dbState==="live" && dbWritable!==false){ cls="on"; txt="Données partagées en ligne"; }
  else if (db && dbState==="live"){ cls="local"; txt="Lecture en ligne · vos saisies restent dans ce navigateur"; }
  else if (dbState==="pending"){ cls=""; txt="Connexion…"; }
  else { cls="local"; txt="Mode démonstration · données dans ce navigateur"; }
  el.innerHTML = '<span class="dot '+cls+'"></span><span>'+txt+'</span>';
}
async function initDb(){
  const timer = setTimeout(()=>{ if (dbState==="pending"){ dbState="off"; renderMode(); } }, 10000);
  try {
    if (!window.claude || typeof window.claude.use !== "function"){ dbState="off"; clearTimeout(timer); renderMode(); return; }
    db = await window.claude.use("db");
    if (!db){ dbState="off"; clearTimeout(timer); renderMode(); return; }
    try { const u = await window.claude.use("user"); if (u && typeof u.can==="function"){ const c = await Promise.resolve(u.can("data.write")); if (c===false) dbWritable=false; else if (c===true) dbWritable=true; } } catch(e){}
    db.collection("reclamations").onSnapshot(snap=>{
      const m = {}; snap.docs.forEach(d=>{ const v=d.data(); if (v && v.id) m[d.id]=v; });
      dbMap = m;
      if (!snap.metadata.fromCache){ clearTimeout(timer); }
      dbState="live"; renderMode(); rerender(true);
    }, err=>{ clearTimeout(timer); dbState="off"; db=null; renderMode(); });
  } catch(e){ clearTimeout(timer); dbState="off"; renderMode(); }
}

const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function ruleClassify(text){
  const t = norm(text);
  const has = (...k)=>k.some(w=>t.includes(w));
  let motif = "Information produit";
  if (has("rembours","annul","retourner","retour du","restitu")) motif="Demande de remboursement";
  else if (has("factur","montant","preleve","prelevement","debite","double paiement","paye deux","tva")) motif="Erreur de facturation";
  else if (has("install","monter","montage","branch","technicien","raccord","fixation")) motif="Installation";
  else if (has("fumee","brul","odeur","etincel","surchauf","court-circuit","panne","casse","defect","ne fonctionne","marche pas","ne s'allume","ne demarre","bruit","fuite","ecran noir","abime","endommag")) motif="Produit défectueux";
  else if (has("livr","retard","colis","pas recu","jamais recu","transporteur","commande")) motif="Retard de livraison";
  let prio = "Moyenne";
  if (has("urgent","dangereux","danger","fumee","brul","incendie","electrocut","avocat","plainte","inadmissible","scandale")) prio="Urgente";
  else if (has("depuis","toujours pas","encore","plusieurs fois","relance","3 semaines","deux semaines","2 semaines","mois")) prio="Élevée";
  else if (motif==="Information produit") prio="Faible";
  const clean = (text||"").trim().replace(/\s+/g," ");
  const resume = clean.length>160 ? clean.slice(0,157)+"…" : clean;
  return {motif, priorite:prio, service:MOTIF_SERVICE[motif], resume: resume || "—",
    justification:"Classement par mots-clés (moteur de règles local). À vérifier par l'agent."};
}

function sanitizeClass(o, fallback){
  const out = Object.assign({}, fallback);
  if (o && typeof o==="object"){
    if (MOTIFS.includes(o.motif)) out.motif=o.motif;
    if (PRIOS.includes(o.priorite)) out.priorite=o.priorite;
    if (SERVICES.includes(o.service)) out.service=o.service; else out.service=MOTIF_SERVICE[out.motif];
    if (typeof o.resume==="string" && o.resume.trim()) out.resume=o.resume.trim().slice(0,400);
    if (typeof o.justification==="string" && o.justification.trim()) out.justification=o.justification.trim().slice(0,400);
  }
  return out;
}

/* ---------- Calculs ---------- */
const DAY = 86400000;
const todayISO = () => new Date().toISOString().slice(0,10);
function ddiff(a,b){ return Math.round((new Date(b+"T00:00:00Z") - new Date(a.slice(0,10)+"T00:00:00Z"))/DAY); }
function age(r){ const end = r.dateCloture ? r.dateCloture.slice(0,10) : (r.source==="import" ? REF_DATE_IMPORT : todayISO()); return Math.max(0, ddiff(r.dateReception, end)); }
function isLate(r){ return age(r) > SLA[r.priorite]; }
function isOpen(r){ return r.statut!=="Clôturée"; }
function respNom(r){ if (r.commercialId && DATA.commerciaux[r.commercialId]) return DATA.commerciaux[r.commercialId].nom; if (r.commercialId==="RESP" && DATA.agences[r.agenceId]) return DATA.agences[r.agenceId].resp; return "Non affecté"; }
function agNom(id){ return DATA.agences[id] ? DATA.agences[id].nom : id; }
function fmtD(s){ if(!s) return "—"; const d=new Date(s.length>10?s:s+"T00:00:00"); return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"}); }
function fmtDT(s){ if(!s) return "—"; if (s.length<=10) return fmtD(s); const d=new Date(s); return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const pct = (a,b)=> b ? Math.round(a*1000/b)/10 : 0;
const fr = n => String(n).replace(".",",");
function pill(cls,txt){ return '<span class="pill '+cls+'">'+esc(txt)+'</span>'; }
const PICON = {"Urgente":"▲▲","Élevée":"▲","Moyenne":"■","Faible":"▽"};
const SICON = {"Nouvelle":"●","En cours":"→","En attente":"‖","Clôturée":"✓"};
function pPill(p){ return pill("p-"+p, PICON[p]+" "+p); }
function statusPill(s){ const map={"Nouvelle":"var(--info-bg);color:var(--info)","En cours":"var(--warn-bg);color:var(--warn)","En attente":"var(--serious-bg);color:var(--serious)","Clôturée":"var(--good-bg);color:var(--good)"}; return '<span class="pill" style="background:'+map[s]+'">'+SICON[s]+' '+esc(s)+'</span>'; }
function stats(recs){
  const total=recs.length, open=recs.filter(isOpen), closed=recs.filter(r=>!isOpen(r));
  const late=recs.filter(isLate);
  const avgClose = closed.length ? closed.reduce((s,r)=>s+age(r),0)/closed.length : 0;
  const count=(arr,key)=>{ const m={}; arr.forEach(r=>{ const k=typeof key==="function"?key(r):r[key]; m[k]=(m[k]||0)+1; }); return m; };
  const avgBy=(arr,key)=>{ const s={},n={}; arr.forEach(r=>{ const k=r[key]; s[k]=(s[k]||0)+age(r); n[k]=(n[k]||0)+1; }); const o={}; for(const k in s) o[k]=Math.round(s[k]*10/n[k])/10; return o; };
  const lateBy=(arr,key)=>{ const m={},n={}; arr.forEach(r=>{ const k=r[key]; n[k]=(n[k]||0)+1; if(isLate(r)) m[k]=(m[k]||0)+1; }); const o={}; for(const k in n) o[k]=pct(m[k]||0,n[k]); return o; };
  return {total, open:open.length, closed:closed.length, late:late.length, latePct:pct(late.length,total), closeRate:pct(closed.length,total),
    avgClose:Math.round(avgClose*10)/10, urgentOpen:open.filter(r=>r.priorite==="Urgente"||r.priorite==="Élevée").length,
    byMotif:count(recs,"motif"), byStatut:count(recs,"statut"), byCanal:count(recs,"canal"), byPrio:count(recs,"priorite"),
    openByAgence:count(open,r=>agNom(r.agenceId)), byAgence:count(recs,r=>agNom(r.agenceId)),
    delaiByMotif:avgBy(closed,"motif"), latePctByMotif:lateBy(recs,"motif"),
    byMonth:count(recs,r=>r.dateReception.slice(0,7)), openByService:count(open,"service")};
}

  return '<div class="bars">'+ent.map(([k,v])=>'<div class="brow" data-tip="'+esc(k)+' : '+fr(v)+(opts.unit||"")+'"><span class="bl">'+esc(k)+'</span><span class="track"><span class="fill" style="display:block;width:'+(v/max*100)+'%"></span></span><span class="bv">'+fr(v)+(opts.unit||"")+'</span></div>').join("")+'</div>';

function monthCols(obj){

    g("aiOut").innerHTML = `<div class="aibox"><h3>✨ Proposition de l'assistant <span class="muted" style="font-weight:500">· ${esc(res.engine==="Claude"?"IA générative (Claude)":"moteur de règles")}</span></h3>
      <dl class="kv"><dt>Résumé</dt><dd>${esc(res.resume)}</dd><dt>Motif</dt><dd>${esc(res.motif)}</dd><dt>Priorité</dt><dd>${pPill(res.priorite)}</dd><dt>Service</dt><dd>${esc(res.service)}</dd><dt>Justification</dt><dd class="muted">${esc(res.justification)}</dd></dl>
      <div style="margin-top:10px;display:flex;gap:8px"><button type="button" class="btn primary sm" id="btnApply">Appliquer la proposition</button><button type="button" class="btn sm" id="btnIgnore">Ignorer</button></div>
      <div class="warnline">⚠ Suggestion automatique : l'agent reste responsable du classement final et peut modifier chaque champ.${res.note?" "+esc(res.note):""}</div></div>`;
    g("btnApply").onclick=()=>{ g("f_motif").value=res.motif; g("f_prio").value=res.priorite; g("f_serv").value=res.service; keep(); formDraft.aiResume=res.resume; formDraft.aiEngine=res.engine; g("aiOut").innerHTML='<div class="banner ok" style="margin:10px 0 0">✓ Proposition appliquée — vérifiez les champs puis enregistrez.</div>'; };
    g("btnIgnore").onclick=()=>{ g("aiOut").innerHTML=""; };
  };
  g("nf").onsubmit=async(e)=>{
    e.preventDefault(); keep();
    const f=formDraft;
    if(!f.client.trim()||!f.description.trim()||!f.motif||!f.service){ toast("Complétez les champs obligatoires (*)."); return; }
    let clientId="", nom=f.client.trim(); const m=nom.match(/^(CL\d{4})\s*·\s*(.+?)(\s*\(.*\))?$/);
    if(m){ clientId=m[1]; nom=DATA.clients[clientId]?DATA.clients[clientId][0]:m[2]; }
    const now=new Date().toISOString();
    const id="REC-"+now.slice(2,4)+now.slice(5,7)+"-"+Date.now().toString(36).slice(-5).toUpperCase();
    const h=[{t:now,a:"Réclamation créée via « "+f.canal+" »",by:"Agent"}];
    if (f.aiResume) h.push({t:now,a:"Classement proposé par l'assistant ("+f.aiEngine+") et validé par l'agent",by:"Agent"});
    if (f.commercialId) h.push({t:now,a:"Affectée à "+respNom({commercialId:f.commercialId,agenceId:f.agenceId})+" ("+f.service+")",by:"Agent"});
    const rec={id,dateReception:now,clientId,clientNom:nom,agenceId:f.agenceId,motif:f.motif,priorite:f.priorite,canal:f.canal,statut:"Nouvelle",dateCloture:null,commercialId:f.commercialId||"",service:f.service,description:f.description.trim(),resumeIA:f.aiResume||"",source:"app",historique:h};
    const where = await saveRec(rec);
    formDraft=null; toast("Réclamation "+id+" enregistrée"+(where==="local"?" (dans ce navigateur)":""));
    location.hash="reclamation-"+id;
  };
}
function viewDetail(id){
  const r = getRec(id);
  if(!r){ V.innerHTML='<a class="backlink" href="#liste">‹ Retour à la liste</a><div class="card">Réclamation introuvable : '+esc(id)+'</div>'; return; }
  const a=age(r), late=isLate(r), idx=STATUTS.indexOf(r.statut);
  V.innerHTML = `
  <a class="backlink" href="#liste">‹ Retour à la liste</a>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px"><h1 style="margin:0">${esc(r.id)}</h1>${statusPill(r.statut)} ${pPill(r.priorite)} ${late?'<span class="pill" style="background:var(--crit-bg);color:var(--crit)">⚠ Hors délai</span>':'<span class="pill" style="background:var(--good-bg);color:var(--good)">✓ Dans les délais</span>'}</div>
  <p class="sub">${esc(r.clientNom)} · ${esc(agNom(r.agenceId))} · reçue le ${fmtDT(r.dateReception)} · ancienneté ${a} j (cible ${SLA[r.priorite]} j)</p>
  <div class="steps">${STATUTS.map((s,i)=>'<div class="step '+(i<idx?"done":i===idx?"cur":"")+'">'+(i<idx?"✓ ":"")+s+'</div>').join("")}</div>
  <div class="grid detail">
    <div class="grid" style="align-content:start">
      <div class="card">
        <h2>Dossier</h2>
        <dl class="kv">
          <dt>Client</dt><dd>${esc(r.clientNom)} ${r.clientId?'<span class="muted">('+esc(r.clientId)+(DATA.clients[r.clientId]?" · "+esc(DATA.clients[r.clientId][1])+" · "+esc(DATA.clients[r.clientId][2]):"")+')</span>':''}</dd>
          <dt>Motif</dt><dd>${esc(r.motif)}</dd>
          <dt>Canal</dt><dd>${esc(r.canal)}</dd>
          <dt>Description</dt><dd>${r.description?esc(r.description).replace(/\n/g,"<br>"):'<span class="muted">Non renseignée (dossier importé du dataset)</span>'}</dd>
          ${r.resumeIA?'<dt>Résumé IA</dt><dd>'+esc(r.resumeIA)+'</dd>':''}
          <dt>Clôture</dt><dd>${r.dateCloture?fmtDT(r.dateCloture):"—"}</dd>
        </dl>
      </div>
      <div class="card">
        <h2>Traitement</h2>
        <div class="form">
          <div class="field"><label>Statut</label><select id="d_stat">${opts(STATUTS,r.statut)}</select></div>
          <div class="field"><label>Priorité</label><select id="d_prio">${opts(PRIOS,r.priorite)}</select></div>
          <div class="field"><label>Service affecté</label><select id="d_serv">${opts(SERVICES,r.service)}</select></div>
          <div class="field"><label>Responsable</label><select id="d_resp">${respOptions(r.agenceId,r.commercialId)}</select></div>
          <div class="field full"><label>Commentaire de suivi (facultatif)</label><input id="d_com" placeholder="Ex. : client rappelé, technicien planifié jeudi…"></div>
        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn primary" id="d_save">Mettre à jour le dossier</button></div>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:0">Réponse au client</h2><span class="muted" style="font-size:12px">${aiLabel()}</span></div>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn ai" id="d_reply">✨ Suggérer une réponse</button></div>
        <div id="replyOut"></div>
      </div>
    </div>
    <div class="card" style="align-self:start"><h2>Historique</h2><ul class="timeline">${(r.historique||[]).slice().reverse().map(h=>'<li><div>'+esc(h.a)+'</div><div class="t">'+fmtDT(h.t)+' · '+esc(h.by||"")+'</div></li>').join("")}</ul></div>
  </div>`;
  const g=x=>document.getElementById(x);
  g("d_save").onclick=async()=>{
    const cur=JSON.parse(JSON.stringify(getRec(id))); const now=new Date().toISOString(); const ch=[];
    const ns=g("d_stat").value, np=g("d_prio").value, nv=g("d_serv").value, nr=g("d_resp").value, com=g("d_com").value.trim();
    if(ns!==cur.statut){ ch.push("Statut : "+cur.statut+" → "+ns); cur.statut=ns; cur.dateCloture = ns==="Clôturée" ? (cur.dateCloture||now) : null; }
    if(np!==cur.priorite){ ch.push("Priorité : "+cur.priorite+" → "+np); cur.priorite=np; }
    if(nv!==cur.service){ ch.push("Service : "+cur.service+" → "+nv); cur.service=nv; }
    if(nr!==(cur.commercialId||"")){ cur.commercialId=nr; ch.push("Affectée à "+respNom(cur)); }
    if(com) ch.push("Commentaire : "+com);
    if(!ch.length){ toast("Aucune modification."); return; }
    cur.historique=(cur.historique||[]).concat(ch.map(a=>({t:now,a,by:"Agent"})));
    g("d_save").disabled=true;
    const w=await saveRec(cur); toast("Dossier mis à jour"+(w==="local"?" (dans ce navigateur)":"")); viewDetail(id);
  };
  g("d_reply").onclick=async()=>{
    const b=g("d_reply"); b.disabled=true; b.innerHTML='<span class="spin"></span> Rédaction…';
    const res=await aiReply(getRec(id));
    b.disabled=false; b.innerHTML="✨ Nouvelle suggestion";
    g("replyOut").innerHTML=`<div class="aibox"><h3>✨ Brouillon de réponse <span class="muted" style="font-weight:500">· ${res.engine==="Claude"?"IA générative (Claude)":"modèle de réponse par motif"}</span></h3>
      <textarea id="replyTxt" style="min-height:190px">${esc(res.text)}</textarea>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="rCopy">Copier</button><button class="btn primary sm" id="rValid">Valider et consigner dans l'historique</button></div>
      <div class="warnline">⚠ Brouillon automatique : relisez et corrigez avant tout envoi. Aucun engagement (montant, délai, geste commercial) ne doit être pris sans validation.</div></div>`;
    g("rCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(g("replyTxt").value); toast("Réponse copiée."); }catch(e){ g("replyTxt").select(); toast("Sélectionnez le texte puis Ctrl+C."); } };
    g("rValid").onclick=async()=>{ const cur=JSON.parse(JSON.stringify(getRec(id))); const now=new Date().toISOString(); cur.reponse=g("replyTxt").value; cur.historique=(cur.historique||[]).concat([{t:now,a:"Réponse client validée par l'agent (brouillon "+(res.engine==="Claude"?"IA":"modèle")+" relu)",by:"Agent"}]); if(cur.statut==="Nouvelle"){ cur.statut="En cours"; cur.historique.push({t:now,a:"Statut : Nouvelle → En cours",by:"Agent"}); } const w=await saveRec(cur); toast("Réponse consignée"+(w==="local"?" (dans ce navigateur)":"")); viewDetail(id); };
  };
}
function viewHelp(){

  <div class="grid two">
   <div class="card"><h2>Parcours de test (5 minutes)</h2><ol style="margin:0;padding-left:18px;line-height:1.8">
     <li><b>Tableau de bord</b> : consulter les KPI, puis cliquer sur « Générer la synthèse ».</li>
     <li><b>+ Nouvelle réclamation</b> : saisir une description, cliquer sur « Analyser avec l'IA », appliquer la proposition, enregistrer.</li>
     <li>Le dossier s'ouvre : changer le <b>statut</b> (En cours), l'<b>affecter</b> à un responsable, ajouter un commentaire, mettre à jour.</li>
     <li>« Suggérer une réponse » : relire le brouillon, le valider.</li>
     <li><b>Réclamations</b> : filtrer (statut, priorité, agence, « ouverts hors délai ») et retrouver le dossier créé.</li></ol></div>
   <div class="card"><h2>Exemples de descriptions à tester</h2><ul style="margin:0;padding-left:18px;line-height:1.7">
     <li>« Commande d'un réfrigérateur passée il y a 3 semaines, toujours pas livrée malgré deux relances. »</li>
     <li>« Ma machine à laver fuit depuis la première utilisation et fait un bruit anormal. »</li>
     <li>« On m'a facturé deux fois le même téléviseur, je veux une correction rapide. »</li>
     <li>« Le climatiseur dégage une odeur de brûlé et de la fumée, c'est urgent ! »</li>
     <li>« Est-ce que le TV QLED 65 pouces est compatible avec Netflix ? »</li></ul></div>
   <div class="card"><h2>Règles de gestion</h2><dl class="kv">
     <dt>Statuts</dt><dd>Nouvelle → En cours → En attente (client / pièce) → Clôturée</dd>
     <dt>Délais cibles</dt><dd>Urgente 2 j · Élevée 5 j · Moyenne 10 j · Faible 15 j</dd>
     <dt>Affectation</dt><dd>Motif → service par défaut (livraison → Logistique ; défaut et installation → SAV technique ; facturation et remboursement → Facturation ; information → Service client), puis un responsable de l'agence</dd>
     <dt>Données</dt><dd>320 réclamations 2025 issues du dataset MAROCMARKET + saisies réalisées dans l'application</dd></dl></div>

     <li>L'IA <b>propose</b>, l'agent <b>valide</b> : aucun classement ni réponse n'est appliqué sans action humaine, et chaque validation est tracée dans l'historique.</li>
     <li>Si l'IA générative n'est pas disponible pour le visiteur, un moteur de règles transparent (mots-clés) prend le relais.</li>

     <li>État de connexion affiché en haut à droite : données partagées en ligne, ou mode démonstration (saisies conservées dans ce navigateur).</li></ul>
     <div style="margin-top:12px"><button class="btn sm" id="resetLocal">Effacer mes saisies locales</button> <span class="muted" style="font-size:12px">${Object.keys(localMap).length} dossier(s) dans ce navigateur</span></div></div>
  </div>`;

function rerender(fromData){
  if (fromData && (route==="nouvelle")) return;
  if (fromData && route.startsWith("reclamation-") && document.activeElement && ["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName)) return;
  if (fromData && route==="liste"){ drawTable(); return; }
  if (fromData && route==="tableau-de-bord" && document.getElementById("btnSynth") && document.getElementById("btnSynth").disabled) return;
  render();
}
function render(){
  const h=(location.hash||"").replace(/^#/,"");
  route = h || "tableau-de-bord";
  document.querySelectorAll("nav.tabs a").forEach(a=>a.classList.toggle("on", a.dataset.r===route || (a.dataset.r==="liste" && route.startsWith("reclamation-"))));
  if (route==="liste") viewList();
  else if (route==="nouvelle") viewNew();
  else if (route==="aide") viewHelp();
  else if (route.startsWith("reclamation-")) viewDetail(route.slice(12));
  else { route="tableau-de-bord"; viewDashboard(); }
}
window.addEventListener("hashchange",()=>{ render(); window.scrollTo(0,0); });
/* infobulles */
const tip=document.getElementById("tip");
document.addEventListener("mousemove",e=>{ const t=e.target.closest("[data-tip]"); if(t){ tip.textContent=t.dataset.tip; tip.style.display="block"; tip.style.left=Math.min(e.clientX+12, innerWidth-270)+"px"; tip.style.top=(e.clientY+14)+"px"; } else tip.style.display="none"; });
render(); renderMode();
initDb(); initAI();
